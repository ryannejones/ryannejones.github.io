  :root {

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    color: var(--cream);
    font-family: 'Libre Baskerville', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;

    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    padding: 2rem 2.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 2rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--gold-light);
    letter-spacing: 0.02em;
  }

  header .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.05em;
  }

  header .epoch {
    margin-left: auto;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.7rem;
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 0.3rem 0.7rem;
    letter-spacing: 0.1em;
  }

  .app {
    display: grid;
    grid-template-columns: 280px 1fr 260px;
    height: calc(100vh - 70px);
  }

  .left-panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .section-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  .dialect-list {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .dialect-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--cream);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.8rem;
    text-align: left;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
    line-height: 1.3;
  }

  .dialect-btn:hover {
    border-color: var(--border);
    background: var(--parchment);
    color: var(--gold-light);
  }

  .dialect-btn.active {
    border-color: var(--gold);
    background: var(--parchment);
    color: var(--gold-light);
  }

  .dialect-btn .region-tag {
    display: block;
    font-size: 0.65rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 0.1rem;
  }

  .layer-toggles {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
  }

  .toggle-row input[type="checkbox"] {
    accent-color: var(--gold);
    width: 14px;
    height: 14px;
  }

  .toggle-row label {
    font-size: 0.78rem;
    color: var(--cream);
    cursor: pointer;
  }

  .toggle-row .swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .map-area {
    position: relative;
    background: #0f0d09;
    overflow: hidden;
  }

  #mapSvg {
    width: 100%;
    height: 100%;
  }

  .map-title {
    position: absolute;
    top: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-align: center;
    pointer-events: none;
    opacity: 0.7;
  }

  .legend {
    position: absolute;
    bottom: 1.5rem;
    left: 1.5rem;
    background: rgba(26,22,16,0.9);
    border: 1px solid var(--border);
    padding: 0.8rem 1rem;
    font-size: 0.7rem;
  }

  .legend-title {
    font-family: 'Source Code Pro', monospace;
    color: var(--gold);
    letter-spacing: 0.1em;
    font-size: 0.6rem;
    margin-bottom: 0.5rem;
  }

  .legend-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.4rem;
  }

  .legend-gradient {
    width: 100px;
    height: 10px;
    border-radius: 1px;
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
    width: 100px;
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  .right-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .info-card {
    background: var(--parchment);
    border: 1px solid var(--border);
    padding: 1rem;
  }

  .info-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--gold-light);
    margin-bottom: 0.5rem;
  }

  .info-card p {
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--cream);
  }

  .feature-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-top: 0.6rem;
  }

  .feature-item {
    font-size: 0.72rem;
    line-height: 1.5;
    color: var(--cream);
  }

  .feature-item strong {
    color: var(--gold-light);
  }

  .similarity-bars {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .sim-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .sim-label {
    font-size: 0.7rem;
    min-width: 100px;
    color: var(--muted);
  }

  .sim-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--parchment);
    border-radius: 2px;
    overflow: hidden;
  }

  .sim-bar-fill {
    height: 100%;
    transition: width 0.3s;
  }

  .sim-pct {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.65rem;
    min-width: 35px;
    text-align: right;
    color: var(--gold);
  }

  .migration-arrow {
    stroke: var(--rust);
    stroke-width: 1.5;
    fill: none;
    opacity: 0.6;
  }

  .trade-route {
    stroke: var(--teal);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 4,4;
    opacity: 0.5;
  }

  #tooltip {
    position: absolute;
    background: rgba(26,22,16,0.95);
    border: 1px solid var(--gold);
    padding: 0.6rem 0.8rem;
    font-size: 0.7rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
    line-height: 1.4;
  }
</style>
</head>

</div>

const MIGRATION_ROUTES = [];

const TRADE_ROUTES = [];

// ─── RENDERING ───────────────────────────────────────────────────────────────

const svgNS = 'http://www.w3.org/2000/svg';
let selectedDialect = null;

function lerp(a, b, t) { return a + (b - a) * t; }

function similarityColor(score) {
  const t = score / 100;
  if (t < 0.5) {
    const u = t / 0.5;
    // 0% = darker blue-grey, 50% = medium
    return `rgb(${Math.round(lerp(80,159,u))},${Math.round(lerp(100,167,u))},${Math.round(lerp(130,160,u))})`;
  } else {
    const u = (t - 0.5) / 0.5;
    // 50% to 100% = lighter gold
    return `rgb(${Math.round(lerp(159,230,u))},${Math.round(lerp(167,200,u))},${Math.round(lerp(160,130,u))})`;
  }
}

function polyCenter(pts) {
  const x = pts.reduce((s,p)=>s+p[0],0)/pts.length;
  const y = pts.reduce((s,p)=>s+p[1],0)/pts.length;
  return [x,y];
}

function buildMap() {
  const rg = document.getElementById('regionsGroup');
  const lg = document.getElementById('labelsGroup');

  Object.entries(REGIONS).forEach(([id, pts]) => {
    const poly = document.createElementNS(svgNS, 'polygon');
    poly.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
    poly.setAttribute('fill', '#1a1610');
    poly.setAttribute('stroke', '#3d3425');
    poly.setAttribute('stroke-width', '1');
    poly.dataset.id = id;
    poly.style.cursor = 'pointer';
    poly.style.transition = 'fill 0.5s';
    poly.addEventListener('mouseenter', (e) => showTooltip(e, id));
    poly.addEventListener('mouseleave', hideTooltip);
    poly.addEventListener('click', () => selectDialect(id));
    rg.appendChild(poly);

    const [cx, cy] = polyCenter(pts);
    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', cx);
    label.setAttribute('y', cy);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'middle');
    label.setAttribute('fill', '#8a7d65');
    label.setAttribute('font-size', '7');
    label.setAttribute('font-family', 'Source Code Pro, monospace');
    label.setAttribute('pointer-events', 'none');
    label.dataset.id = id;
    const d = DIALECTS.find(d=>d.id===id);
    label.textContent = d ? d.name.toUpperCase() : id.toUpperCase().replace(/_/g, ' ');
    lg.appendChild(label);
  });
}

function buildMigrationRoutes() {
  const mg = document.getElementById('migrationGroup');
  mg.innerHTML = '';

  MIGRATION_ROUTES.forEach(r => {
    const fromPts = REGIONS[r.from];
    const toPts = REGIONS[r.to];
    if (!fromPts || !toPts) return;
    
    const [fx, fy] = polyCenter(fromPts);
    const [tx, ty] = polyCenter(toPts);
    
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', fx);
    line.setAttribute('y1', fy);
    line.setAttribute('x2', tx);
    line.setAttribute('y2', ty);
    line.setAttribute('class', 'migration-arrow');
    line.setAttribute('marker-end', 'url(#arrow-migration)');
    mg.appendChild(line);
  });
}

function buildTradeRoutes() {
  const tg = document.getElementById('tradeGroup');
  tg.innerHTML = '';
  TRADE_ROUTES.forEach(r => {
    const poly = document.createElementNS(svgNS, 'polyline');
    poly.setAttribute('points', r.path.map(p=>p.join(',')).join(' '));
    poly.setAttribute('class', 'trade-route');
    poly.setAttribute('marker-end', 'url(#arrow-trade)');
    tg.appendChild(poly);
  });
}

function updateHeatmap() {
  const polys = document.querySelectorAll('#regionsGroup polygon');
  polys.forEach(poly => {
    const id = poly.dataset.id;
    if (!selectedDialect) {
      poly.setAttribute('fill', '#1a1610');
      return;
    }
    if (id === selectedDialect.id) {
      poly.setAttribute('fill', '#c9a84c');
      poly.setAttribute('fill-opacity', '0.5');
      return;
    }
    const score = selectedDialect.similarity[id] ?? 30;
    poly.setAttribute('fill', similarityColor(score));
    poly.setAttribute('fill-opacity', '0.7');
  });

  document.getElementById('refName').textContent = selectedDialect ? selectedDialect.name.toUpperCase() : '—';

  document.querySelectorAll('#labelsGroup text').forEach(t => {
    t.setAttribute('fill', selectedDialect ? '#c9a84c' : '#8a7d65');
    t.setAttribute('font-size', '7');
  });
}

function selectDialect(id) {
  const d = DIALECTS.find(x => x.id === id);
  if (!d) return;
  selectedDialect = d;

  document.querySelectorAll('.dialect-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === id);
  });

  updateHeatmap();
  renderRightPanel(d);
}

function renderRightPanel(d) {
  const panel = document.getElementById('rightPanel');

  const others = DIALECTS.filter(x => x.id !== d.id)
    .map(x => ({ id: x.id, name: x.name, score: d.similarity[x.id] ?? 0 }))
    .sort((a,b) => b.score - a.score);

  const barsHtml = others.map(o => {
    const color = similarityColor(o.score);
    return `<div class="sim-row">
      <span class="sim-label">${o.name}</span>
      <div class="sim-bar-bg">
        <div class="sim-bar-fill" style="width:${o.score}%;background:${color};"></div>
      </div>
      <span class="sim-pct">${o.score.toFixed(1)}%</span>
    </div>`;
  }).join('');

  const featuresHtml = d.features.map(f =>
    `<div class="feature-item"><strong>${f.label}</strong> — ${f.note}</div>`
  ).join('');

  panel.innerHTML = `
    <div class="info-card">
      <h3>${d.name}</h3>
      <p style="font-size:0.68rem;color:var(--muted);margin-bottom:0.5rem;font-style:italic;">${d.region}</p>
      <p>${d.description}</p>
    </div>

    <div>
      <div class="section-label">Key Features</div>
      <div class="feature-list">${featuresHtml}</div>
    </div>

    <div>
      <div class="section-label">Similarity to All Regions</div>
      <div class="similarity-bars">${barsHtml}</div>
    </div>
  `;
}

const tooltip = document.getElementById('tooltip');
function showTooltip(e, id) {
  const d = DIALECTS.find(x => x.id === id);
  if (!d) return;
  let extra = '';
  if (selectedDialect && selectedDialect.id !== id) {
    const score = selectedDialect.similarity[id] ?? '—';
    extra = `<br><span style="color:var(--gold);">${typeof score === 'number' ? score.toFixed(1) : score}% similarity</span>`;
  }
  tooltip.innerHTML = `<strong>${d.name}</strong><br>${d.region}${extra}`;
  tooltip.style.opacity = 1;
  moveTip(e);
}
function hideTooltip() { tooltip.style.opacity = 0; }
function moveTip(e) {
  const rect = document.querySelector('.map-area').getBoundingClientRect();
  tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
  tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
}
document.querySelector('.map-area').addEventListener('mousemove', e => {
  if (tooltip.style.opacity > 0) moveTip(e);
});

function buildDialectList() {
  const list = document.getElementById('dialectList');
  DIALECTS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'dialect-btn';
    btn.dataset.id = d.id;
    btn.innerHTML = `${d.name}<span class="region-tag">${d.region}</span>`;
    btn.addEventListener('click', () => selectDialect(d.id));
    list.appendChild(btn);
  });
}

function buildLegend() {
  const grad = document.getElementById('legendGrad');
  const colors = [];
  for (let i = 0; i <= 20; i++) {
    colors.push(similarityColor(i * 5));
  }
  grad.style.background = `linear-gradient(to right, ${colors.join(',')})`;
}

buildDialectList();
buildMap();
buildMigrationRoutes();
buildTradeRoutes();
buildLegend();
</script>
</body>
</html>
